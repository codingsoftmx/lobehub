<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agentes</title>
    <style>
      .drag-bar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 48px;
        -webkit-app-region: drag;
      }

      body {
        margin: 0;
        padding: 48px 0 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #ffffff;
        overflow: hidden;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #1a1a2e;
        }
      }

      .container {
        text-align: center;
        animation: fadeIn 0.8s ease-in-out;
      }

      .splash-logo {
        width: 300px;
        height: auto;
        display: block;
      }

      .splash-logo-dark {
        display: none;
      }

      @media (prefers-color-scheme: dark) {
        .splash-logo-light {
          display: none;
        }
        .splash-logo-dark {
          display: block;
        }
      }

      @keyframes fadeIn {
        0% {
          opacity: 0;
          transform: scale(0.95);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div class="drag-bar"></div>
    <div class="container">
      <img class="splash-logo splash-logo-light" src="splash-light.png" alt="Agentes" />
      <img class="splash-logo splash-logo-dark" src="splash-dark.png" alt="Agentes" />
    </div>
  </body>
</html>
